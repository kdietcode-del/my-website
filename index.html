<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뷰티 제품 런칭 상황판</title>
  <meta name="description" content="뷰티 제품 아이디어를 모으고, 기획부터 생산까지 9단계 진행률을 추적하고, 경쟁 제품을 비교하는 상황판.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#view">본문으로 건너뛰기</a>

  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__text">
          <strong>런칭 상황판</strong>
          <span>뷰티 제품 기획 · 진행 · 리서치</span>
        </span>
      </div>

      <div class="topbar__actions">
        <button type="button" id="clear-samples" class="btn btn--ghost btn--sm" hidden>샘플 지우기</button>
        <button type="button" id="import-btn" class="btn btn--ghost btn--sm">불러오기</button>
        <input type="file" id="import-input" accept="application/json,.json" hidden>
        <button type="button" id="export-btn" class="btn btn--ghost btn--sm">백업</button>
        <button type="button" id="theme-toggle" class="btn btn--ghost btn--sm">◐ 시스템 설정</button>
      </div>
    </div>

    <nav class="tabs" id="tabs" role="tablist" aria-label="화면 전환"></nav>
  </header>

  <main class="view" id="view" role="tabpanel"></main>

  <footer class="sitefoot">
    <p>입력한 내용은 이 브라우저에만 저장됩니다. 다른 기기에서 쓰거나 백업하려면 위의 <strong>백업</strong>으로 JSON 파일을 내려받아 두세요.</p>
  </footer>

  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ideas.js"></script>
  <script src="js/pipeline.js"></script>
  <script src="js/competitors.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
